<h2>EasyMAC 1.2.8</h2>
<ul>
  <li><b>Menu bar icons stay visible</b> — on MacBooks with a notch, macOS hides icons that don't fit when an app with a long menu is in front. The Clipboard, Keep Awake and Files icons now sit right next to the clock, so they are the last to be hidden. You can still ⌘-drag them anywhere.</li>
