name: EasyMAC
options:
  bundleIdPrefix: com.appalbania
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: 89K4SJGXLP
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  EasyMAC:
    type: application
    platform: macOS
    sources:
      - path: EasyMAC
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    info:
      path: EasyMAC/Info.plist
      properties:
        CFBundleName: EasyMAC
        CFBundleDisplayName: EasyMAC
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 AppAlbania"
        NSAccessibilityUsageDescription: "EasyMAC uses Accessibility to focus, move and resize your windows."
        NSScreenCaptureUsageDescription: "EasyMAC uses Screen Recording to show live thumbnails of your windows."
        NSPrincipalClass: NSApplication
        SUFeedURL: https://appalbania.com/easymac/appcast.xml
        SUPublicEDKey: FAn0gT9H9/c4h43pe5BCNNfwHFD0XUpUv+UvDlMOvHw=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: EasyMAC/EasyMAC.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_NAME: EasyMAC
        PRODUCT_BUNDLE_IDENTIFIER: com.appalbania.easymac
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"

  EasyMACTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EasyMACTests
      # Pure logic is compiled straight into the test bundle (no host app launch needed).
      - path: EasyMAC/Layouts/LayoutPreset.swift
      - path: EasyMAC/Layouts/LayoutEngine.swift
      - path: EasyMAC/Windows/Coordinates.swift
      - path: EasyMAC/Windows/WindowMatcher.swift
      - path: EasyMAC/Workspaces/Workspace.swift
      - path: EasyMAC/Workspaces/WorkspaceStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appalbania.easymac.tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EasyMAC:
    build:
      targets:
        EasyMAC: all
        EasyMACTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EasyMACTests
    archive:
      config: Release
